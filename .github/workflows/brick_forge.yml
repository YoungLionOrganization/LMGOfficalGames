name: Brick Forge

on:
  push:
    branches: [main]
    paths:
      - 'games/brick_forge/**'
      - 'tools/build_game.py'
      - '.github/workflows/brick_forge.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'games/brick_forge/**'
      - 'tools/build_game.py'
      - '.github/workflows/brick_forge.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-game.yml
    with:
      game: brick_forge
