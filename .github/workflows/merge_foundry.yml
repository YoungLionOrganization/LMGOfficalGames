name: Merge Foundry

on:
  push:
    branches: [main]
    paths:
      - 'games/merge_foundry/**'
      - 'tools/build_game.py'
      - '.github/workflows/merge_foundry.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'games/merge_foundry/**'
      - 'tools/build_game.py'
      - '.github/workflows/merge_foundry.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-game.yml
    with:
      game: merge_foundry
