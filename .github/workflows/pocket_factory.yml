name: Pocket Factory

on:
  push:
    branches: [main]
    paths:
      - 'games/pocket_factory/**'
      - 'tools/build_game.py'
      - '.github/workflows/pocket_factory.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'games/pocket_factory/**'
      - 'tools/build_game.py'
      - '.github/workflows/pocket_factory.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-game.yml
    with:
      game: pocket_factory
