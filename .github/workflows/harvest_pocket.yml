name: Harvest Pocket

on:
  push:
    branches: [main]
    paths:
      - 'games/harvest_pocket/**'
      - 'tools/build_game.py'
      - '.github/workflows/harvest_pocket.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'games/harvest_pocket/**'
      - 'tools/build_game.py'
      - '.github/workflows/harvest_pocket.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-game.yml
    with:
      game: harvest_pocket
