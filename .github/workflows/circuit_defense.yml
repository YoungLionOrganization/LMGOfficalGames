name: Circuit Defense

on:
  push:
    branches: [main]
    paths:
      - 'games/circuit_defense/**'
      - 'tools/build_game.py'
      - '.github/workflows/circuit_defense.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'games/circuit_defense/**'
      - 'tools/build_game.py'
      - '.github/workflows/circuit_defense.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-game.yml
    with:
      game: circuit_defense
