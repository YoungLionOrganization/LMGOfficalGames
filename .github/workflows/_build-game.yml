name: Build game

on:
  workflow_call:
    inputs:
      game:
        description: Game folder under games/
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GAME: ${{ inputs.game }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: inputs.game == 'gem_cascade' || inputs.game == 'harvest_pocket' || inputs.game == 'pocket_factory_community'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate Dungeon Delver
        if: inputs.game == 'dungeon_delver'
        working-directory: games/dungeon_delver
        run: python tools/validate_source.py
      - name: Validate Gem Cascade
        if: inputs.game == 'gem_cascade'
        working-directory: games/gem_cascade
        run: python tools/validate_source.py
      - name: Validate Harvest Pocket
        if: inputs.game == 'harvest_pocket'
        working-directory: games/harvest_pocket
        run: |
          python tools/validate_package.py
          python tools/test_gameplay.py
          python tools/test_migration.py
          python tools/meta_audit.py
      - name: Validate Pocket Factory Community
        if: inputs.game == 'pocket_factory_community'
        run: node tools/test_pocket_factory_city.mjs games/pocket_factory_community
      - name: Install Qt resource compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qt6-base-dev-tools
      - name: Build and hash RCC
        run: python tools/build_game.py "$GAME" --rcc /usr/lib/qt6/libexec/rcc
      - name: Upload package and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.game }}-rcc
          path: |
            games/${{ inputs.game }}/dist/*.rcc
            games/${{ inputs.game }}/dist/*.rcc.sha256
          if-no-files-found: error
