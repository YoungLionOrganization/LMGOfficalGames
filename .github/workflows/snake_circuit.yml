name: Snake Circuit

on:
  push:
    branches: [main]
    paths:
      - 'games/snake_circuit/**'
      - 'tools/build_game.py'
      - '.github/workflows/snake_circuit.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'games/snake_circuit/**'
      - 'tools/build_game.py'
      - '.github/workflows/snake_circuit.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-game.yml
    with:
      game: snake_circuit
