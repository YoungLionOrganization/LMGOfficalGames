name: Gem Cascade

on:
  push:
    branches: [main]
    paths:
      - 'games/gem_cascade/**'
      - 'tools/build_game.py'
      - '.github/workflows/gem_cascade.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'games/gem_cascade/**'
      - 'tools/build_game.py'
      - '.github/workflows/gem_cascade.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-game.yml
    with:
      game: gem_cascade
