name: Astro Courier

on:
  push:
    branches: [main]
    paths:
      - 'games/astro_courier/**'
      - 'tools/build_game.py'
      - '.github/workflows/astro_courier.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'games/astro_courier/**'
      - 'tools/build_game.py'
      - '.github/workflows/astro_courier.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-game.yml
    with:
      game: astro_courier
