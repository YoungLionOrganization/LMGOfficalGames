name: Star Defender

on:
  push:
    branches: [main]
    paths:
      - 'games/star_defender/**'
      - 'tools/build_game.py'
      - '.github/workflows/star_defender.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'games/star_defender/**'
      - 'tools/build_game.py'
      - '.github/workflows/star_defender.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-game.yml
    with:
      game: star_defender
