name: Sudoku Master

on:
  push:
    branches: [main]
    paths:
      - 'games/sudoku_master/**'
      - 'tools/build_game.py'
      - '.github/workflows/sudoku_master.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'games/sudoku_master/**'
      - 'tools/build_game.py'
      - '.github/workflows/sudoku_master.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-game.yml
    with:
      game: sudoku_master
