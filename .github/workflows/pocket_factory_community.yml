name: Pocket Factory Community

on:
  push:
    branches: [main]
    paths:
      - 'games/pocket_factory_community/**'
      - 'tools/build_game.py'
      - 'tools/test_pocket_factory_city.mjs'
      - '.github/workflows/pocket_factory_community.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'games/pocket_factory_community/**'
      - 'tools/build_game.py'
      - 'tools/test_pocket_factory_city.mjs'
      - '.github/workflows/pocket_factory_community.yml'
      - '.github/workflows/_build-game.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-game.yml
    with:
      game: pocket_factory_community
